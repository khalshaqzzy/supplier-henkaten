name: supplier-henkaten-e2e

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-bookworm@sha256:12a379b47ad65289572ea0756efc11b7c241a6662833e8af7038cd3b73d647e0
    environment:
      POSTGRES_USER: supplier_henkaten_e2e
      POSTGRES_PASSWORD: supplier_henkaten_e2e_local_only
      POSTGRES_DB: supplier_henkaten_e2e
    ports:
      - '127.0.0.1:${E2E_POSTGRES_PORT:-55433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U supplier_henkaten_e2e -d supplier_henkaten_e2e']
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 3s

volumes:
  postgres-data:
