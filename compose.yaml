name: supplier-henkaten-local

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-bookworm@sha256:12a379b47ad65289572ea0756efc11b7c241a6662833e8af7038cd3b73d647e0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supplier_henkaten}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supplier_henkaten_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-supplier_henkaten}
      TEST_DATABASE_NAME: ${TEST_DATABASE_NAME:-supplier_henkaten_test}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready --username ${POSTGRES_USER:-supplier_henkaten} --dbname ${POSTGRES_DB:-supplier_henkaten}',
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
    name: supplier-henkaten-local-postgres-data
