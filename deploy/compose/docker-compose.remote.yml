x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-api-environment: &api-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3000
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE}
  RELEASE_SHA: ${RELEASE_SHA}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_PRETTY: 'false'
  CORS_ALLOWED_ORIGINS: https://${SUPPLIER_DOMAIN},https://${TMMIN_DOMAIN}
  SUPPLIER_APP_ORIGIN: https://${SUPPLIER_DOMAIN}
  TMMIN_APP_ORIGIN: https://${TMMIN_DOMAIN}
  TRUST_PROXY_HOPS: '1'
  DB_POOL_MAX: ${DB_POOL_MAX:-20}
  DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
  DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
  OUTBOX_ENABLED: 'true'
  OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-1000}
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
  OUTBOX_LOCK_LEASE_MS: ${OUTBOX_LOCK_LEASE_MS:-30000}
  OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
  REALTIME_POLL_MS: ${REALTIME_POLL_MS:-1000}
  SESSION_CSRF_SECRET: ${SESSION_CSRF_SECRET}
  AUTH_THROTTLE_SECRET: ${AUTH_THROTTLE_SECRET}
  AUTH_IP_LOGIN_LIMIT: ${AUTH_IP_LOGIN_LIMIT:-50}
  AUTH_GLOBAL_LIMIT_PER_MINUTE: ${AUTH_GLOBAL_LIMIT_PER_MINUTE:-300}
  ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-19456}
  ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:-2}
  ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
  PHOTO_STORAGE_ROOT: /var/lib/supplier-henkaten/member-photos

services:
  postgres:
    image: supplier-henkaten-postgres:18.4-pgvector-0.8.5
    build:
      context: ../..
      dockerfile: deploy/postgres/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - ${SHARED_DIR}/postgres-data:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    logging: *default-logging

  migrate:
    profiles: [operations]
    image: supplier-henkaten-api:${RELEASE_SHA}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        RELEASE_SHA: ${RELEASE_SHA}
    init: true
    group_add:
      - '2000'
    command: [node, node_modules/prisma/build/index.js, migrate, deploy, --config, prisma.config.ts]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    volumes:
      - ${SHARED_DIR}/member-photos:/var/lib/supplier-henkaten/member-photos
    restart: 'no'
    logging: *default-logging

  bootstrap-admin:
    profiles: [operations]
    image: supplier-henkaten-api:${RELEASE_SHA}
    init: true
    group_add:
      - '2000'
    command: [node, dist/cli/admin.js, bootstrap]
    environment:
      <<: *api-environment
      TMMIN_BOOTSTRAP_USERNAME: ${TMMIN_BOOTSTRAP_USERNAME}
      TMMIN_BOOTSTRAP_DISPLAY_NAME: ${TMMIN_BOOTSTRAP_DISPLAY_NAME}
      TMMIN_BOOTSTRAP_PASSWORD: ${TMMIN_BOOTSTRAP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    volumes:
      - ${SHARED_DIR}/member-photos:/var/lib/supplier-henkaten/member-photos
    restart: 'no'
    logging: *default-logging

  api:
    image: supplier-henkaten-api:${RELEASE_SHA}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        RELEASE_SHA: ${RELEASE_SHA}
    init: true
    group_add:
      - '2000'
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - data
    volumes:
      - ${SHARED_DIR}/member-photos:/var/lib/supplier-henkaten/member-photos
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/ready').then(async(r)=>{const b=await r.json();if(!r.ok||b.status!=='ready'||b.releaseSha!==process.env.RELEASE_SHA)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    logging: *default-logging

  supplier-web:
    image: supplier-henkaten-supplier-web:${RELEASE_SHA}
    build:
      context: ../..
      dockerfile: apps/supplier-web/Dockerfile
      args:
        RELEASE_SHA: ${RELEASE_SHA}
        VITE_API_ORIGIN: https://${SUPPLIER_DOMAIN}
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

  tmmin-web:
    image: supplier-henkaten-tmmin-web:${RELEASE_SHA}
    build:
      context: ../..
      dockerfile: apps/tmmin-web/Dockerfile
      args:
        RELEASE_SHA: ${RELEASE_SHA}
        VITE_API_ORIGIN: https://${TMMIN_DOMAIN}
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

  caddy:
    image: supplier-henkaten-caddy:${RELEASE_SHA}
    build:
      context: ../..
      dockerfile: deploy/caddy/Dockerfile
      args:
        RELEASE_SHA: ${RELEASE_SHA}
    init: true
    group_add:
      - '2000'
    restart: unless-stopped
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL}
      CADDY_SCHEME: ${CADDY_SCHEME:-}
      SUPPLIER_DOMAIN: ${SUPPLIER_DOMAIN}
      TMMIN_DOMAIN: ${TMMIN_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - ${PUBLISHED_HTTP_PORT:-80}:80
      - ${PUBLISHED_HTTPS_PORT:-443}:443
      - ${PUBLISHED_HTTPS_PORT:-443}:443/udp
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SHARED_DIR}/caddy-data:/data
      - ${SHARED_DIR}/caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      supplier-web:
        condition: service_healthy
      tmmin-web:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    logging: *default-logging

networks:
  edge:
  data:
    internal: true
