packages:
  - apps/api
  - apps/supplier-web
  - apps/tmmin-web
  - apps/e2e
  - packages/api-client
  - packages/contracts
  - packages/test-fixtures
  - packages/ui

allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  msw: true
  prisma: true

minimumReleaseAgeExclude:
  - lucide-react@1.26.0
  - '@playwright/test@1.62.0'
  - playwright-core@1.62.0
  - playwright@1.62.0

sharedWorkspaceLockfile: true
