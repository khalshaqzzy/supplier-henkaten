packages:
  - apps/api
  - apps/supplier-web
  - apps/tmmin-web
  - apps/e2e
  - packages/api-client
  - packages/contracts
  - packages/test-fixtures
  - packages/ui

allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  msw: true
  prisma: true

auditConfig:
  ignoreGhsas:
    - GHSA-qwww-vcr4-c8h2

overrides:
  brace-expansion@<=5.0.8: 5.0.9
  fast-uri@>=3.0.0 <3.1.5: 3.1.5
  find-my-way@<=9.6.0: 9.7.0
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  deepmerge-ts@<8.0.0: 8.0.0
  nanoid@<3.3.18: 3.3.18
  undici@>=7.0.0 <7.29.0: 7.29.0

minimumReleaseAgeExclude:
  - lucide-react@1.26.0
  - '@playwright/test@1.62.0'
  - playwright-core@1.62.0
  - playwright@1.62.0

sharedWorkspaceLockfile: true
